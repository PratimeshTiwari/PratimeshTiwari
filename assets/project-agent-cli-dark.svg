  <text x="24" y="312" font-size="13.5" fill="#8d96a0" >A Claude Code-style coding agent for the terminal with no API</text>
  <text x="24" y="331.575" font-size="13.5" fill="#8d96a0" >key. It drives a Gemini tab in your own Chrome, then reads,</text>
  <text x="24" y="351.15" font-size="13.5" fill="#8d96a0" >searches, edits as diffs you approve and runs commands.</text>
